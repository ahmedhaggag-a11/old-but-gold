<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reset Password - Knowledge Center</title>
  <link rel="stylesheet" href="../../static/css/register.css">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/358045773_695100129297630_6681247707211595226_n.jpg') }}">
</head>
<body class="login-page">
  <div class="login-container">
    <h2 class="fade-in">إعادة تعيين كلمة المرور</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash-message {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <form class="form-animate" method="POST" action="">
      <div class="form-group">
        <input type="password" name="password" placeholder="كلمة المرور الجديدة" class="input-animate" required minlength="6"/>
      </div>
      <div class="form-group">
        <input type="password" name="confirm_password" placeholder="تأكيد كلمة المرور" class="input-animate" required minlength="6"/>
      </div>
      <button type="submit" class="btn-animate">تعيين كلمة المرور</button>
      <p class="register-link"><a href="{{ url_for('auth.login_page') }}">العودة لتسجيل الدخول</a></p>
    </form>
    <style>
      .flash-message {
        padding: 10px;
        border-radius: 8px;
        margin-bottom: 10px;
        text-align: center;
        font-weight: bold;
      }
      .flash-message.success { background: #e0f7fa; color: #00796b; }
      .flash-message.danger { background: #ffebee; color: #c62828; }
    </style>
  </div>
</body>
</html>
