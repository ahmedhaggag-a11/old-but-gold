<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <title>تسجيل دخول الأدمن</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="../admin/admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      background: #f4f6fa;
      font-family: 'Cairo', 'Tajawal', Arial, sans-serif;
      direction: rtl;
    }
    .admin-login-container {
      max-width: 400px;
      margin: 80px auto;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 16px #1976d21a;
      padding: 32px 28px;
      text-align: center;
    }
    .admin-login-container h2 {
      color: #1976d2;
      margin-bottom: 24px;
    }
    .admin-login-container input[type="text"],
    .admin-login-container input[type="password"] {
      width: 90%;
      padding: 10px;
      margin: 10px 0 18px 0;
      border-radius: 8px;
      border: 1px solid #90caf9;
      font-size: 1em;
      background: #f9f9f9;
    }
    .admin-login-container button {
      background: #1976d2;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 28px;
      font-size: 1.1em;
      cursor: pointer;
      font-weight: 600;
      margin-top: 8px;
      transition: background 0.2s;
    }
    .admin-login-container button:hover {
      background: #1769aa;
    }
    .login-error {
      color: #d32f2f;
      margin-bottom: 10px;
      display: none;
    }
    .login-success {
      color: #2e7d32;
      margin-bottom: 10px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="admin-login-container">
    <h2><i class="fas fa-user-shield"></i> دخول الأدمن</h2>
    
    <form id="adminLoginForm">
      <div class="login-error" id="loginError">اسم المستخدم أو كلمة المرور غير صحيحة</div>
      <div class="login-success" id="loginSuccess">تم تسجيل الدخول بنجاح</div>
      <input type="text" name="username" placeholder="اسم المستخدم" required>
      <input type="password" name="password" placeholder="كلمة المرور" required>
      <button type="submit"><i class="fas fa-sign-in-alt"></i> دخول</button>
    </form>
  </div>
  <script>
    document.getElementById('adminLoginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const formData = new FormData(this);
      const errorDiv = document.getElementById('loginError');
      const successDiv = document.getElementById('loginSuccess');
      
      // Hide previous messages
      errorDiv.style.display = 'none';
      successDiv.style.display = 'none';
      
      try {
        const response = await fetch('/api/admin/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            username: formData.get('username'),
            password: formData.get('password')
          })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          successDiv.textContent = data.message;
          successDiv.style.display = 'block';
          
          // Redirect to admin workspace
          setTimeout(() => {
            window.location.href = '/admin/workspace';
          }, 1000);
        } else {
          errorDiv.textContent = data.error;
          errorDiv.style.display = 'block';
        }
      } catch (error) {
        errorDiv.textContent = 'حدث خطأ في الاتصال بالخادم';
        errorDiv.style.display = 'block';
      }
    });
  </script>
</body>
</html>
