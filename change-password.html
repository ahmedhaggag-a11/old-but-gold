<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Password</title>
    <link rel="stylesheet" href="login.css"/>
    <link rel="icon" type="image/png" href="images/358045773_695100129297630_6681247707211595226_n.jpg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body class="login-page">
  <div class="login-container">
    <h2 class="fade-in">Change Password</h2>
    <form id="passwordForm" class="form-animate">
      <div class="input-group">
        <div class="form-group password-wrapper">
          <input type="password" id="oldPassword" placeholder="Old Password" required class="input-animate"/>
        </div>
        <div class="form-group password-wrapper">
          <input type="password" id="newPassword" placeholder="New Password" required class="input-animate"/>
          <span class="toggle-password">
            <i class="fa-regular fa-eye" id="toggleNewPassword"></i>
          </span>
        </div>
        <div class="form-group password-wrapper">
          <input type="password" id="confirmPassword" placeholder="Confirm New Password" required class="input-animate"/>
          <span class="toggle-password">
            <i class="fa-regular fa-eye" id="toggleConfirmPassword"></i>
          </span>
        </div>
      </div>
      <div class="success" id="passwordMsg"></div>
      <div class="error" id="passwordErr"></div>
      <button type="submit" class="btn-animate">Change Password</button>
      <p class="forgot-password">
        <a href="forgot-password.html">Forgot Password?</a>
      </p>
    </form>
  </div>
  <script>
    // Toggle show/hide for new password
    const newPassword = document.getElementById('newPassword');
    const toggleNewPassword = document.getElementById('toggleNewPassword');
    toggleNewPassword.addEventListener('click', function () {
      const type = newPassword.getAttribute('type') === 'password' ? 'text' : 'password';
      newPassword.setAttribute('type', type);
      this.classList.toggle('fa-eye-slash');
    });

    // Toggle show/hide for confirm password
    const confirmPassword = document.getElementById('confirmPassword');
    const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');
    toggleConfirmPassword.addEventListener('click', function () {
      const type = confirmPassword.getAttribute('type') === 'password' ? 'text' : 'password';
      confirmPassword.setAttribute('type', type);
      this.classList.toggle('fa-eye-slash');
    });

    document.getElementById('passwordForm').onsubmit = function(e) {
      e.preventDefault();
      const oldPass = document.getElementById('oldPassword').value;
      const newPass = document.getElementById('newPassword').value;
      const confirmPass = document.getElementById('confirmPassword').value;
      const msg = document.getElementById('passwordMsg');
      const err = document.getElementById('passwordErr');
      msg.textContent = '';
      err.textContent = '';

      if (newPass.length < 6) {
        err.textContent = "Password must be at least 6 characters.";
        return;
      }
      if (newPass !== confirmPass) {
        err.textContent = "Passwords do not match.";
        return;
      }
      // هنا يمكنك إضافة تحقق oldPass حسب نظامك
      msg.textContent = "Password changed successfully!";
      document.getElementById('passwordForm').reset();
      setTimeout(() => { msg.textContent = ""; }, 2000);
    };
  </script>
</body>
</html>
