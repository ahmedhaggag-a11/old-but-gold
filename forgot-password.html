<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password - Knowledge Center</title>
  <link rel="stylesheet" href="register.css">
  <link rel="icon" type="image/png" href="images/358045773_695100129297630_6681247707211595226_n.jpg">
</head>
<body class="login-page">
  <div class="login-container">
    <h2 class="fade-in">Reset Your Password</h2>
    <form id="resetForm" class="form-animate">
      <div class="form-group" id="phoneGroup">
        <input type="text" name="phone" placeholder="Enter your phone number" class="input-animate"/>
      </div>
      <div class="form-group" id="emailGroup" style="display:none;">
        <input type="email" name="email" placeholder="Enter your email" class="input-animate"/>
      </div>
      <button type="button" class="btn-animate" id="toggleMethod" style="margin-bottom:10px;">Use Email Instead</button>
      <div class="form-group" id="codeGroup" style="display:none;">
        <input type="text" name="code" placeholder="Enter the code sent to your phone/email" class="input-animate"/>
      </div>
      <div class="form-group" id="newPassGroup" style="display:none;">
        <input type="password" name="new_password" placeholder="Enter new password" class="input-animate"/>
      </div>
      <button type="submit" class="btn-animate" id="sendBtn">Send Code</button>
      <p class="register-link"><a href="login.html">Back to Login</a></p>
      <p id="msg" style="text-align:center;color:#2196f3;margin-top:10px;"></p>
    </form>
  </div>
  <script>
    // زرار التبديل بين الهاتف والإيميل
    const toggleBtn = document.getElementById('toggleMethod');
    const phoneGroup = document.getElementById('phoneGroup');
    const emailGroup = document.getElementById('emailGroup');
    let useEmail = false;
    toggleBtn.onclick = function() {
      useEmail = !useEmail;
      if(useEmail) {
        phoneGroup.style.display = 'none';
        emailGroup.style.display = '';
        toggleBtn.textContent = "Use Phone Instead";
      } else {
        phoneGroup.style.display = '';
        emailGroup.style.display = 'none';
        toggleBtn.textContent = "Use Email Instead";
      }
    };

    // محاكاة إرسال الكود وتغيير كلمة المرور (بدون باك اند)
    let sent = false, verified = false;
    document.getElementById('resetForm').onsubmit = function(e) {
      e.preventDefault();
      const phone = this.phone ? this.phone.value : '';
      const email = this.email ? this.email.value : '';
      const code = this.code ? this.code.value : '';
      const newPass = this.new_password ? this.new_password.value : '';
      const msg = document.getElementById('msg');
      if (!sent) {
        if((!useEmail && !phone) || (useEmail && !email)) {
          msg.textContent = useEmail ? "Please enter your email." : "Please enter your phone number.";
          return;
        }
        document.getElementById('codeGroup').style.display = 'block';
        document.getElementById('sendBtn').textContent = 'Verify Code';
        msg.textContent = useEmail ? 'A code has been sent to your email!' : 'A code has been sent to your phone!';
        sent = true;
      } else if (!verified) {
        // تحقق من الكود (هنا الكود الثابت 1234 للتجربة)
        if (code === '1234') {
          document.getElementById('newPassGroup').style.display = 'block';
          document.getElementById('sendBtn').textContent = 'Reset Password';
          msg.textContent = 'Enter your new password.';
          verified = true;
        } else {
          msg.textContent = 'Wrong code, try again!';
        }
      } else {
        // تغيير كلمة المرور
        msg.textContent = 'Password has been reset successfully!';
        document.getElementById('sendBtn').disabled = true;
      }
    };
  </script>
</body>
</html>
